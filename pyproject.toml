[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "autoc"
version = "2.0.0"
description = "Realtime monitor countdown for Google identity rotation"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["monitoring", "countdown", "google", "tkinter", "sse"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/cvsz/autoc"
Documentation = "https://github.com/cvsz/autoc#readme"
Issues = "https://github.com/cvsz/autoc/issues"
Changelog = "https://github.com/cvsz/autoc/blob/main/CHANGELOG.md"

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
autoc = "app:main"
autoc-web = "app:main"
autoc-gui = "gui:main"
autoc-term = "realtime_monitor:main"

[tool.setuptools]
py-modules = ["app", "gui", "monitor_core", "realtime_monitor"]
