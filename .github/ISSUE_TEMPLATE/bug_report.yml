name: Bug report
description: Report a reproducible problem with autoc
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include `.env` contents, API keys, tokens, or private identities.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Python version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use synthetic credentials and sanitized commands/output.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: text
