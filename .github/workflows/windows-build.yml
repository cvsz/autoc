name: Windows GUI Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "app.py"
      - "gui.py"
      - "monitor_core.py"
      - "realtime_monitor.py"
      - "pyproject.toml"
      - "README.md"
      - "windows/**"
      - ".github/workflows/windows-build.yml"

jobs:
  build-windows-gui:
    runs-on: windows-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ vars.PYTHON_VERSION }}

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"

      - name: Build standalone GUI
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File windows\build_gui.ps1

      - name: Smoke test packaged EXE
        shell: pwsh
        run: |
          if (-not (Test-Path dist\windows\ggtmoni-gui.exe)) {
            throw "Missing dist\\windows\\ggtmoni-gui.exe"
          }
          if (-not (Test-Path dist\windows\.env.example)) {
            throw "Missing dist\\windows\\.env.example"
          }
          & dist\windows\ggtmoni-gui.exe --help | Out-Host

      - name: Verify standalone zip
        shell: pwsh
        run: |
          $zipPath = "dist\ggtmoni-windows11-gui.zip"
          if (Test-Path $zipPath) {
            Write-Host "Found $zipPath"
          } else {
            throw "Missing dist\\ggtmoni-windows11-gui.zip"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggtmoni-windows11-gui-zip
          path: dist/ggtmoni-windows11-gui.zip
          if-no-files-found: error
